<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reportar Incidente</title>
</head>

<body>

<header>
    <h1>Reporte de Incidentes</h1>
</header>

<nav>
    <a href="index.html">Inicio</a> |
    <a href="reportar.html">Reportar</a> |
    <a href="tickets.html">Tickets</a>
</nav>

<main>

<section>

    <h2>Nuevo Ticket</h2>

    <article>
        <h3>Formulario de Registro</h3>

        <form>

            <label for="titulo">Título del incidente:</label><br>
            <input type="text" id="titulo" name="titulo"><br><br>

            <label for="categoria">Categoría:</label><br>

            <select id="categoria" name="categoria">
                <option>Red</option>
                <option>Hardware</option>
                <option>Software</option>
            </select>

            <br><br>

            <label>Prioridad:</label><br>

            <input type="radio" id="alta" name="prioridad" value="Alta">
            <label for="alta">Alta</label>

            <input type="radio" id="media" name="prioridad" value="Media">
            <label for="media">Media</label>

            <input type="radio" id="baja" name="prioridad" value="Baja">
            <label for="baja">Baja</label>

            <br><br>

            <label for="descripcion">Descripción:</label><br>

            <textarea id="descripcion" name="descripcion" rows="5" cols="40"></textarea>

            <br><br>

            <input type="submit" value="Enviar Ticket">

        </form>

    </article>

</section>

</main>

<footer>
    <p>Help Desk 2026</p>
</footer>

</body>
</html>
